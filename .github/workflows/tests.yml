name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No ANTHROPIC_API_KEY is set: these tests only exercise pure-Python
        # logic (chunking, the rate calculator, retrieval fusion) and never
        # call the Anthropic API.
        run: pytest tests/ -v
